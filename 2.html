<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hi</title>
  </head>
  <body>
    <h1 id="counter">Paperclips: </h1>
    <button id="clicker">Click me</button>
      <script>
          let count = 0;
            display = document.getByElementId('counter');
            button = document.getByElementId('clicker');

            button.onclick = function() {
                count += 1;
                display.textContent = count;
            };
      </script>
  </body>
</html>
